name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests (real hardware reads on the Windows runner)
        run: npm test

      # Bundle the official Intel PresentMon console app (MIT) so FPS works out of the box.
      - name: Bundle PresentMon console (FPS)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Newest stable PresentMon release that ships the console exe (the Intel signature is verified below).
          $releases = gh release list --repo GameTechDev/PresentMon --limit 15 --exclude-pre-releases --exclude-drafts --json tagName --jq '.[].tagName'
          $tag = $null; $asset = $null
          foreach ($r in $releases) {
            $names = gh release view $r --repo GameTechDev/PresentMon --json assets --jq '.assets[].name'
            $hit = $names | Where-Object { $_ -match '^PresentMon-[\d.]+-x64\.exe$' } | Select-Object -First 1
            if ($hit) { $tag = $r; $asset = $hit; break }
          }
          if (-not $asset) { throw "No PresentMon console asset found in releases: $($releases -join ', ')" }
          Write-Host "Using PresentMon $tag ($asset)"
          gh release download $tag --repo GameTechDev/PresentMon --pattern $asset --dir $env:RUNNER_TEMP --clobber
          New-Item -ItemType Directory -Force resources/presentmon | Out-Null
          Move-Item (Join-Path $env:RUNNER_TEMP $asset) resources/presentmon/PresentMon.exe -Force
          $sig = Get-AuthenticodeSignature resources/presentmon/PresentMon.exe
          Write-Host "Asset: $asset  SHA256: $((Get-FileHash resources/presentmon/PresentMon.exe).Hash)"
          Write-Host "Signature: $($sig.Status) / $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Intel') { throw 'PresentMon signature is not a valid Intel signature' }

      # The runner is headless, so usually no app presents frames and PresentMon prints no CSV at all
      # (it writes the header with the first frame). We require a clean run (ETW session starts, no
      # access errors) and verify the CSV columns whenever any output was produced.
      - name: Smoke-test PresentMon
        shell: pwsh
        run: |
          $out = & resources/presentmon/PresentMon.exe --output_stdout --no_console_stats --stop_existing_session --session_name FristyCI --timed 3 --terminate_after_timed 2>&1
          $code = $LASTEXITCODE
          Write-Host "exit code: $code"
          Write-Host (($out | Select-Object -First 3) -join "`n")
          if ($out -match 'access denied|failed to start|error') { throw 'PresentMon failed to start a trace session' }
          if ($code -ne 0) { throw "PresentMon exited with $code" }
          $header = $out | Where-Object { $_ -match '^Application,' } | Select-Object -First 1
          if ($header -and $header -notmatch 'MsBetweenPresents|FrameTime') { throw 'PresentMon CSV header does not contain the columns FRISTY reads' }

      - name: Build installer
        run: npm run dist:win

      - name: Verify PresentMon is packaged
        shell: pwsh
        run: |
          $p = 'dist/win-unpacked/resources/resources/presentmon/PresentMon.exe'
          if (-not (Test-Path $p)) { throw "Bundled PresentMon missing: $p" }
          Write-Host "Packaged: $p ($((Get-Item $p).Length) bytes)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FRISTY-PC-Manager-Setup
          path: dist/*.exe

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Publishes (or updates) the release v<package.json version> with the installer attached.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FRISTY PC Manager v${{ steps.ver.outputs.version }}
          files: dist/*.exe
          overwrite_files: true
          body: |
            ## FRISTY PC Manager v${{ steps.ver.outputs.version }}

            **התקנה:** הורד את קובץ ה-Setup ‏(.exe) למטה והפעל אותו.
            הקובץ לא חתום דיגיטלית, לכן Windows SmartScreen עשוי להזהיר — לחץ **More info → Run anyway**.

            **טמפרטורות ומאווררים:** הפעל את LibreHardwareMonitor כמנהל ו-FRISTY יקרא את החיישנים אוטומטית.

            ---
            Install: download the Setup .exe below and run it. The installer is unsigned, so SmartScreen may warn — choose *More info → Run anyway*.
