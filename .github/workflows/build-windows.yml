name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests (real hardware reads on the Windows runner)
        run: npm test

      - name: Build installer
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FRISTY-PC-Manager-Setup
          path: dist/*.exe

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Publishes (or updates) the release v<package.json version> with the installer attached.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FRISTY PC Manager v${{ steps.ver.outputs.version }}
          files: dist/*.exe
          overwrite_files: true
          body: |
            ## FRISTY PC Manager v${{ steps.ver.outputs.version }}

            **התקנה:** הורד את קובץ ה-Setup ‏(.exe) למטה והפעל אותו.
            הקובץ לא חתום דיגיטלית, לכן Windows SmartScreen עשוי להזהיר — לחץ **More info → Run anyway**.

            **טמפרטורות ומאווררים:** הפעל את LibreHardwareMonitor כמנהל ו-FRISTY יקרא את החיישנים אוטומטית.

            ---
            Install: download the Setup .exe below and run it. The installer is unsigned, so SmartScreen may warn — choose *More info → Run anyway*.
